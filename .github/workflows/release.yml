name: Release Validation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: v0.83.0
        environments: py313 default
        locked: true

    - name: Run tests
      run: pixi run -e py313 test

    - name: Get version
      id: get_version
      run: |
        echo "VERSION=$(pixi run -e py313 python -c 'from nmaipy import __version__; print(__version__)')" >> $GITHUB_OUTPUT

    - name: Verify tag matches version
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        PACKAGE_VERSION=${{ steps.get_version.outputs.VERSION }}
        if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
          echo "Error: Tag version ($TAG_VERSION) doesn't match package version ($PACKAGE_VERSION)"
          exit 1
        fi

    - name: Build package
      run: pixi run build

    - name: Upload artifacts to release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: dist/*
        fail_on_unmatched_files: true

    - name: Verify PyPI package
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        echo "Checking for nmaipy $VERSION on PyPI..."
        for i in 1 2 3; do
          echo "Attempt $i/3..."
          if curl -sf "https://pypi.org/pypi/nmaipy/$VERSION/json" > /dev/null; then
            echo "Found nmaipy $VERSION on PyPI"
            exit 0
          fi
          if [ $i -lt 3 ]; then
            echo "Not found yet, waiting 30 seconds..."
            sleep 30
          fi
        done
        echo "ERROR: nmaipy $VERSION not found on PyPI after 3 attempts"
        echo "Did you run /publish or manually upload to PyPI before pushing the tag?"
        exit 1
