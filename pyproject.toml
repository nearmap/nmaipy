[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nmaipy"
dynamic = ["version"]
description = "Nearmap AI Python Library for extracting AI features from aerial imagery"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Nearmap AI Systems", email = "ai.systems@nearmap.com"}
]
maintainers = [
    {name = "Nearmap AI Systems", email = "ai.systems@nearmap.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["nearmap", "ai", "geospatial", "gis", "aerial", "imagery", "buildings", "vegetation"]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.0",
    "fsspec>=2025.3.0",
    "geopandas>=1.1.1",
    "numpy>=2.3.5",
    "orjson>=3.9",
    "pandas>=2.3.3",
    "psutil>=7.1.3",
    "pyarrow>=20.0.0",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rtree",
    "s3fs>=2025.3.0",
    "shapely>=2.1.1",
    "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/nearmap/nmaipy"
Documentation = "https://github.com/nearmap/nmaipy#readme"
Repository = "https://github.com/nearmap/nmaipy.git"
"Bug Tracker" = "https://github.com/nearmap/nmaipy/issues"

[tool.hatch.version]
path = "nmaipy/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["nmaipy"]

[tool.hatch.build.targets.sdist]
include = ["/nmaipy"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["I", "PD", "NPY", "RUF", "E", "W", "F", "UP", "C90", "B", "N", "A", "COM", "C4", "DTZ", "ARG", "PL", "RET",
  "S108", "TID251", "ASYNC", "BLE001", "FAST001", "LOG", "PGH004", "PT", "PTH", "S113", "S307", "S324", "S501", "S506",
  "S602", "S605", "T20", "TRY002", "TRY201", "TRY400", "TRY401"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "C901", "ARG001", "ARG002", "ARG005", "PLR0912", "COM812", "PTH118", "PTH123"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]
"notebooks/**" = ["T20"]
"bump_version.py" = ["T20"]
"examples.py" = ["T20"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pylint]
max-statements = 100
max-args = 10

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tempfile.gettempdir".msg = "Fixed names in the shared temp dir collide across processes; use tempfile.mkstemp(), tempfile.mkdtemp() or a caller-supplied directory."

[tool.ty.rules]
# Enforced.
abstract-and-final-method = "error"
abstract-method-in-final-class = "error"
ambiguous-protocol-member = "error"
assert-type-unspellable-subtype = "error"
blanket-ignore-comment = "error"
call-abstract-method = "error"
call-non-callable = "error"
call-top-callable = "error"
conflicting-declarations = "error"
conflicting-metaclass = "error"
cyclic-class-definition = "error"
cyclic-type-alias-definition = "error"
dataclass-field-order = "error"
deprecated = "error"
disjoint-cast = "error"
division-by-zero = "error"
duplicate-base = "error"
duplicate-kw-only = "error"
dynamic-function-decorator-return = "error"
empty-body = "error"
escape-character-in-forward-annotation = "error"
experimental-syntax = "error"
final-on-non-method = "error"
final-without-value = "error"
ignore-comment-unknown-rule = "error"
implicit-concatenated-string-type-annotation = "error"
inconsistent-mro = "error"
index-out-of-bounds = "error"
ineffective-final = "error"
instance-layout-conflict = "error"
invalid-attribute-access = "error"
invalid-attribute-override = "error"
invalid-await = "error"
invalid-base = "error"
invalid-context-manager = "error"
invalid-dataclass = "error"
invalid-dataclass-override = "error"
invalid-declaration = "error"
invalid-enum-member-annotation = "error"
invalid-exception-caught = "error"
invalid-explicit-override = "error"
invalid-frozen-dataclass-subclass = "error"
invalid-generic-class = "error"
invalid-generic-enum = "error"
invalid-ignore-comment = "error"
invalid-init-type-variable = "error"
invalid-key = "error"
invalid-legacy-positional-parameter = "error"
invalid-legacy-type-variable = "error"
invalid-match-pattern = "error"
invalid-metaclass = "error"
invalid-method-override = "error"
invalid-module-getattr-call = "error"
invalid-mutable-override = "error"
invalid-named-tuple = "error"
invalid-named-tuple-override = "error"
invalid-newtype = "error"
invalid-overload = "error"
invalid-parameter-default = "error"
invalid-paramspec = "error"
invalid-property-type-override = "error"
invalid-protocol = "error"
invalid-raise = "error"
invalid-super-argument = "error"
invalid-syntax-in-forward-annotation = "error"
invalid-total-ordering = "error"
invalid-type-alias-type = "error"
invalid-type-arguments = "error"
invalid-type-checking-constant = "error"
invalid-type-form = "error"
invalid-type-guard-definition = "error"
invalid-type-variable-bound = "error"
invalid-type-variable-constraints = "error"
invalid-type-variable-default = "error"
invalid-typed-dict-field = "error"
invalid-typed-dict-header = "error"
invalid-typed-dict-statement = "error"
invalid-yield = "error"
isinstance-against-protocol = "error"
isinstance-against-typed-dict = "error"
mismatched-sentinel-name = "error"
mismatched-type-name = "error"
missing-argument = "error"
missing-direct-dependency = "error"
missing-slot = "error"
missing-typed-dict-key = "error"
non-callable-init-subclass = "error"
not-iterable = "error"
override-of-final-method = "error"
override-of-final-variable = "error"
parameter-already-assigned = "error"
positional-only-parameter-as-kwarg = "error"
possibly-missing-attribute = "error"
possibly-missing-implicit-call = "error"
possibly-missing-import = "error"
possibly-missing-submodule = "error"
pydantic-discarded-extra-argument = "error"
raw-string-type-annotation = "error"
redundant-cast = "error"
redundant-condition = "error"
redundant-final-classvar = "error"
shadowed-type-variable = "error"
static-assert-error = "error"
subclass-of-dataclass-with-order = "error"
subclass-of-final-class = "error"
super-call-in-named-tuple-method = "error"
too-many-positional-arguments = "error"
truthiness-test-of-callable = "error"
truthiness-test-of-iterable = "error"
truthiness-test-of-none-union = "error"
type-assertion-failure = "error"
unavailable-implicit-super-arguments = "error"
unbound-type-variable = "error"
undefined-reveal = "error"
unknown-argument = "error"
unresolved-global = "error"
unresolved-import = "error"
unresolved-reference = "error"
unsupported-base = "error"
unsupported-bool-conversion = "error"
unsupported-dynamic-base = "error"
unsupported-operator = "error"
unused-awaitable = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
useless-overload-body = "error"
zero-stepsize-in-slice = "error"
# Not yet enforced.
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
missing-override-decorator = "ignore"
missing-type-argument = "ignore"
no-matching-overload = "ignore"
not-subscriptable = "ignore"
possibly-unresolved-reference = "ignore"
redundant-condition-strict = "ignore"
unresolved-attribute = "ignore"
unsound-assignment = "ignore"
unsound-return-statement = "ignore"
unsound-yield = "ignore"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]
requires-pixi = ">=0.83"

[tool.pixi.package]
name = "nmaipy"
# pixi-build cannot read hatchling's dynamic version; bump_version.py keeps this equal to nmaipy/__version__.py
version = "5.5.2"

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"]

[tool.pixi.package.build.config]
ignore-pypi-mapping = false
# the mapping service picks geopandas-base (no pyogrio) and pyarrow-core (no Parquet)
pypi-conda-map = { geopandas = "geopandas", pyarrow = "pyarrow" }

[tool.pixi.dependencies]
nmaipy = { path = "." }

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
responses = "*"
pyyaml = "*"
packaging = "*"

[tool.pixi.feature.test.tasks]
test = "pytest -m 'not live_api'"

[tool.pixi.feature.notebooks.dependencies]
ipykernel = "*"
matplotlib-base = "*"

[tool.pixi.feature.build.dependencies]
python-build = "*"
twine = "*"

[tool.pixi.feature.build.tasks]
build = "rm -rf dist && python -m build && twine check --strict dist/*"

# Bump deliberately: a ruff minor changes the format style, and a ty release adds rules that check_ty_rules.py makes you list.
[tool.pixi.feature.lint.dependencies]
ruff = "0.17.*"

[tool.pixi.feature.lint.tasks]
lint = { cmd = "ruff check && ruff format --check", depends-on = [{ task = "typecheck", environment = "typecheck" }] }
format = "ruff check --fix --exit-zero && ruff format"

[tool.pixi.feature.typecheck.dependencies]
ty = "0.0.92.*"

[tool.pixi.feature.typecheck.tasks]
typecheck = "python scripts/check_ty_rules.py && ty check --error-on-warning"

[tool.pixi.feature.docs.dependencies]
mystmd = "*"

[tool.pixi.feature.docs.tasks]
# mystmd does not copy assets referenced from the custom stylesheet
docs = { cmd = "rm -rf _build/html && myst build --html --strict && cp -r _static/fonts _build/html/fonts", cwd = "docs" }

[tool.pixi.environments]
default = { features = ["py314", "test", "build", "notebooks"], solve-group = "py314" }
py313 = { features = ["py313", "test"], solve-group = "py313" }
py314 = { features = ["py314", "test"], solve-group = "py314" }
lint = { features = ["lint"], no-default-feature = true }
typecheck = { features = ["py314", "test", "notebooks", "typecheck"], solve-group = "py314" }
docs = { features = ["py314", "docs"], no-default-feature = true }
